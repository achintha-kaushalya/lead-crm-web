<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead CRM — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles/dashboard.css"/>
</head>
<body>

  <!-- ── TOP NAV ──────────────────────────────────────────────────── -->
  <header class="topnav">
    <div class="topnav-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24" style="color:var(--primary)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span class="brand-name">LeadCRM</span>
      </div>
    </div>
    <div class="topnav-center">
      <div class="top-search-wrapper">
        <span class="top-search-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="topSearchInput" placeholder="Search Master Leads (any keyword)..." onkeydown="handleTopSearch(event)"/>
        <button class="btn-top-search" onclick="triggerTopSearch()">Search</button>
      </div>
    </div>
    <div class="topnav-right">
      <div class="status-dot"></div>
      <span class="status-text">Live</span>
      <div class="user-badge" title="Logged in">PS</div>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </header>

  <!-- ── MAIN LAYOUT ──────────────────────────────────────────────── -->
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">

        <div class="nav-section-label">CRM TOOLS</div>

        <button class="sidebar-btn active" onclick="switchTab('sheet', this)">
          <span class="sb-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </span>
          Master Leads
        </button>

        <a href="my-leads.html" class="sidebar-btn" style="text-decoration:none;">
          <span class="sb-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          My Leads (CRM Table)
        </a>

        <div class="nav-section-label" style="margin-top:20px;">SYSTEM</div>

        <button class="sidebar-btn" onclick="refreshSheet()">
          <span class="sb-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </span>
          Refresh Sheet
        </button>

      </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">

      <!-- SHEET IFRAME WRAPPER -->
      <div class="sheet-container" id="sheetContainer">
        <div class="sheet-toolbar">
          <span class="sheet-label" id="sheetLabel">📋 Master Leads</span>
          <a class="open-in-sheets" href="https://docs.google.com/spreadsheets/d/10ZKNM3tEtCTcXSYLZPFBhkrZQ7qR1XXkl84b7j0Ss_Q/edit" target="_blank">
            🔗 Open in Google Sheets
          </a>
        </div>
        <iframe
          id="sheetFrame"
          src="https://docs.google.com/spreadsheets/d/10ZKNM3tEtCTcXSYLZPFBhkrZQ7qR1XXkl84b7j0Ss_Q/edit?usp=sharing&rm=minimal"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>

    </main>
  </div>

  <!-- ── SLIDE-IN PANELS ─────────────────────────────────────────── -->

  <!-- SEARCH PANEL -->
  <div class="panel-overlay" id="searchOverlay" onclick="closePanel('search')"></div>
  <div class="slide-panel" id="searchPanel">
    <div class="panel-header">
      <h3>🔍 Search a Number</h3>
      <button class="panel-close" onclick="closePanel('search')">✕</button>
    </div>
    <div class="panel-body">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="searchPhone" placeholder="e.g. 0771234567" oninput="searchNumber()"/>
      </div>
      <div id="searchResult" class="search-result-area">
        <div class="search-placeholder">Type a number above to search...</div>
      </div>
    </div>
  </div>

  <!-- CALL LOG PANEL -->
  <div class="panel-overlay" id="callLogOverlay" onclick="closePanel('callLog')"></div>
  <div class="slide-panel" id="callLogPanel">
    <div class="panel-header">
      <h3>📞 Log a Call</h3>
      <button class="panel-close" onclick="closePanel('callLog')">✕</button>
    </div>
    <div class="panel-body">
      <p class="panel-note">📌 Log a call manually. This records the time automatically.</p>
      <div class="form-group">
        <label>F-Code</label>
        <input type="text" id="callFCode" placeholder="e.g. F01025"/>
      </div>
      <div class="form-group">
        <label>Call Result</label>
        <select id="callResult">
          <option>Contacted</option>
          <option>No Answer</option>
          <option>Busy</option>
          <option>Wrong number</option>
          <option>Off</option>
          <option>Interested</option>
          <option>Not Interested</option>
          <option>Converted</option>
        </select>
      </div>
      <div class="form-group">
        <label>Duration (minutes)</label>
        <input type="number" id="callDuration" placeholder="e.g. 3" min="0"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="callNotes" placeholder="Any important details from the call..."></textarea>
      </div>
      <button class="btn-submit" onclick="submitCallLog()">Save Call Log</button>
      <div id="callLogResult" class="result-msg" style="display:none;"></div>
    </div>
  </div>

  <script src="scripts/dashboard.js"></script>
</body>
</html>
